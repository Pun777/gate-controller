# Builds the Docker compile server and runs an end-to-end test against it:
# verify, error reporting with line numbers, publish, and serving the files.
name: Test compile server image

on:
  push:
    branches: [main]
    paths: ["server/**", "firmware/**", "web/**", "project.json", "docker-compose.yml"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f server/Dockerfile -t gate-controller-ide .

      - name: Image size
        run: docker image ls gate-controller-ide

      - name: Start server
        run: |
          docker run -d --name ide -p 8080:8080 gate-controller-ide
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/healthz && break; sleep 2; done

      - name: End-to-end test
        run: python3 server/selftest.py http://localhost:8080

      - name: Server log
        if: always()
        run: docker logs ide | tail -50
